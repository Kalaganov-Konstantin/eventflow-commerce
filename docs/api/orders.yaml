openapi: 3.0.3
info:
  title: Order Service API
  description: >
    Order creation and lookup. Every request is scoped to the customer carried in the
    X-User-ID header: the API Gateway sets this header from a validated JWT, so a client
    calling through the gateway only needs a valid bearer token. A client calling the order
    service directly (bypassing the gateway) must set X-User-ID itself.
  version: "1.0.0"
  license:
    name: MIT
    url: https://github.com/Kalaganov-Konstantin/eventflow-commerce/blob/main/LICENSE
servers:
  - url: http://localhost:8080
    description: Through the API Gateway (local docker compose stack)
  - url: http://localhost:8081
    description: Directly against the order service
security:
  - CustomerHeader: []
tags:
  - name: orders
    description: Order creation and lookup, scoped to the customer in X-User-ID
paths:
  /api/v1/orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      description: >
        Reserves stock for every item synchronously before accepting the order: a shortage
        answers 409 and creates nothing. Once stock is reserved, the order is saved in
        pending_payment and an order.ready_for_payment event is enqueued through the
        transactional outbox for the payment saga to pick up.
      parameters:
        - $ref: "#/components/parameters/XUserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "202":
          description: Order accepted; stock is reserved and payment is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Insufficient inventory for one or more items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: The inventory service is unreachable or its circuit breaker is open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "504":
          description: The inventory service did not respond within its request timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the current customer's orders
      parameters:
        - $ref: "#/components/parameters/XUserID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of orders belonging to the customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOrdersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order
      parameters:
        - $ref: "#/components/parameters/XUserID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The order belongs to a different customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    CustomerHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: >
        Customer id, set by the API Gateway from the caller's validated JWT. A client calling the
        order service directly must set it itself; there is no bearer token check at this layer.
  parameters:
    XUserID:
      name: X-User-ID
      in: header
      required: true
      description: Customer id, set by the API Gateway from the validated JWT
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Malformed request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    Unauthorized:
      description: Missing or malformed X-User-ID header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    NotFound:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
  schemas:
    AppError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: string
    OrderItemRequest:
      type: object
      required: [product_id, quantity, unit_price_cents]
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        product_sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          format: int64
          description: Price of a single unit, in minor currency units (cents)
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        currency:
          type: string
          description: ISO 4217 currency code; defaults to USD when omitted
          default: USD
    CreateOrderResponse:
      type: object
      required: [order_id, status]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          example: pending_payment
    OrderItem:
      type: object
      required: [id, product_id, product_name, quantity, unit_price_cents, total_price_cents]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        product_sku:
          type: string
        quantity:
          type: integer
        unit_price_cents:
          type: integer
          format: int64
        total_price_cents:
          type: integer
          format: int64
    Order:
      type: object
      required:
        - id
        - customer_id
        - status
        - total_amount_cents
        - currency
        - items
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - pending_payment
            - payment_failed
            - confirmed
            - processing
            - shipped
            - delivered
            - cancelled
        total_amount_cents:
          type: integer
          format: int64
        currency:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    ListOrdersResponse:
      type: object
      required: [orders, limit, offset]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        limit:
          type: integer
        offset:
          type: integer
