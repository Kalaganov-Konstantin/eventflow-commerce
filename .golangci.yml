run:
  timeout: 5m
  build-tags:
    - integration
    - e2e

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - errcheck
