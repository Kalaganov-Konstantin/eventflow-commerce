# Second Deployment for the api-gateway canary subset (see infrastructure/istio/destination-rules.yaml).
# Starts at zero replicas: scripts/canary.sh scales it up before shifting any VirtualService weight
# to it, and scales it back down on rollback. Shares the api-gateway Service and ServiceAccount
# defined in api-gateway.yaml, only the "version" label and image tag differ from the stable
# Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-canary
  namespace: eventflow
  labels:
    app: api-gateway
    version: canary
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
      version: canary
  template:
    metadata:
      labels:
        app: api-gateway
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-gateway
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: eventflow-commerce/api-gateway:canary
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventflow-config
            - secretRef:
                name: eventflow-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
