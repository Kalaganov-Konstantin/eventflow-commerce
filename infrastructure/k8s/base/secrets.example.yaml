# Template for the "eventflow-secrets" Secret every Deployment in this base reads via
# envFrom.secretRef. It is not part of kustomization.yaml's resources and is never applied by
# `kubectl kustomize base | kubectl apply -f -`: copy it outside the repository, fill in real
# values, and apply that copy on its own (kubectl apply -f secrets.yaml) before the rest of the
# base. The real secret is never committed.
apiVersion: v1
kind: Secret
metadata:
  name: eventflow-secrets
  namespace: eventflow
type: Opaque
stringData:
  # Postgres superuser, used by the postgres StatefulSet and the init-databases init container.
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""

  # Per-service database URLs, each pointing at the database and role init-databases.sh creates.
  API_GATEWAY_DATABASE_URL: ""
  ORDER_DATABASE_URL: ""
  PAYMENT_DATABASE_URL: ""
  INVENTORY_DATABASE_URL: ""
  NOTIFICATION_DATABASE_URL: ""

  # HMAC signing key for the api-gateway's JWT validation; at least 32 characters and not one of
  # the placeholder values api-gateway/internal/config rejects at startup.
  JWT_SECRET: ""

  # Optional SMTP credentials for the notification service; left empty, notifications still send
  # through an unauthenticated relay.
  NOTIFICATION_SMTP_USER: ""
  NOTIFICATION_SMTP_PASSWORD: ""
