# Uses the notification service's own image: the Dockerfile already bakes ./migrations in, so,
# unlike the three Go jobs above, no ConfigMap mount is needed here.
apiVersion: batch/v1
kind: Job
metadata:
  name: notification-migrate
  namespace: eventflow
  labels:
    app: notification-migrate
    eventflow.io/phase: migrate
  annotations:
    eventflow.io/run-before: "notification-service"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: notification-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: yoyo
          image: eventflow-commerce/notification:latest
          imagePullPolicy: IfNotPresent
          command:
            - "yoyo"
            - "apply"
            - "--batch"
            - "--database"
            - "$(NOTIFICATION_DATABASE_URL)"
            - "./migrations"
          env:
            - name: NOTIFICATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eventflow-secrets
                  key: NOTIFICATION_DATABASE_URL
