# Connection pool and outlier detection settings sit alongside the gobreaker circuit breakers
# planned for the Go services: the mesh trips on repeated 5xx before a client-side breaker would,
# and ejects an unhealthy pod from the load balancing pool independently of application code.
# Every service gets stable/canary subsets by the "version" pod label, ready for canary rollouts;
# only api-gateway currently runs pods labeled "canary" (see api-gateway-canary.yaml).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: eventflow
spec:
  host: api-gateway
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
---
