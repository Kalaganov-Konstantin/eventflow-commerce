global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical
    - match:
        severity: warning
      receiver: warning

receivers:
  # Stub receiver: logs whatever it receives instead of paging anyone. Good enough to see
  # alerts firing without wiring up a real channel.
  - name: default
    webhook_configs:
      - url: 'http://webhook-logger:8080/'
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: 'http://webhook-logger:8080/'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: 'http://webhook-logger:8080/'
        send_resolved: true
    # Real paging channels, disabled until this deployment has its own webhook and key.
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/YOUR-WEBHOOK'
    #     channel: '#eventflow-alerts'
    #     send_resolved: true
    # pagerduty_configs:
    #   - service_key: 'REPLACE_WITH_YOUR_PAGERDUTY_INTEGRATION_KEY'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'job']
