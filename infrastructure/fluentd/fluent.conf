# Tails every container's json-file log on the docker host instead of using the fluentd logging
# driver, so application containers start and run independently of whether this profile is up.
<source>
  @type tail
  path /var/lib/docker/containers/*/*-json.log
  exclude_path ["/var/lib/docker/containers/*/*-json.log.*"]
  pos_file /fluentd/log/docker-containers.log.pos
  tag docker.container.*
  path_key source_path
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

# The docker json-file driver wraps every line in a "log" field. Services that write json
# themselves outside development (see the api-gateway, order, payment, inventory and
# notification services) get that inner payload parsed again here, so fields like level and
# service become top-level and searchable in Kibana instead of sitting inside a string.
<filter docker.container.**>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# source_path is the full log file path, /var/lib/docker/containers/<id>/<id>-json.log; keep
# only the short container id from it and drop the path itself.
<filter docker.container.**>
  @type record_transformer
  enable_ruby true
  remove_keys source_path
  <record>
    container_id ${File.basename(File.dirname(record["source_path"]))[0,12]}
  </record>
</filter>

<match docker.container.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix eventflow
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key container_log_tag
  <buffer>
    @type file
    path /fluentd/log/buffer/eventflow
    flush_interval 5s
    retry_max_times 5
  </buffer>
</match>
