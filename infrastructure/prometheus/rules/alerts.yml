groups:
  - name: eventflow-commerce
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (
            rate({__name__=~"api_gateway_requests_total|order_http_requests_total|payment_http_requests_total|inventory_http_requests_total", status_code=~"5.."}[5m])
          )
          /
          sum by (job) (
            rate({__name__=~"api_gateway_requests_total|order_http_requests_total|payment_http_requests_total|inventory_http_requests_total"}[5m])
          )
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is returning too many 5xx responses"
          description: "{{ $labels.job }} has served over 5% 5xx responses for the last 5 minutes (current value: {{ $value | humanizePercentage }})."

      - alert: GatewayHighLatency
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(api_gateway_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API gateway p99 latency is above one second"
          description: "The gateway's p99 request latency has been above 1s for 5 minutes (current value: {{ $value }}s)."

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker {{ $labels.name }} has been open for over a minute"
          description: "{{ $labels.name }} has stayed open for more than a minute; calls through it are being rejected."

      - alert: OutboxBacklogGrowing
        expr: |
          deriv(outbox_backlog_size[10m]) > 0 and outbox_backlog_size > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog for {{ $labels.service }} keeps growing"
          description: "{{ $labels.service }}'s outbox backlog has trended upward over the last 10 minutes; the relay may be stuck or Kafka may be unreachable."

      - alert: DeadLetterQueueGrowing
        expr: |
          increase(kafka_topic_partition_current_offset{topic=~".+\\.dlq"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Messages are landing in {{ $labels.topic }}"
          description: "{{ $labels.topic }} received new messages in the last 10 minutes, meaning consumers are failing to process events."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }}) for over a minute."
